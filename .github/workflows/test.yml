name: test

on:
  push:
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-integration:
    name: unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run lint
      - name: Unit + integration (coverage thresholds enforced by vitest)
        run: npm run test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: end-to-end + a11y + perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end (Playwright builds the app via webServer)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Single required status check: both suites had to pass.
  release-gate:
    name: release gate
    runs-on: ubuntu-latest
    needs: [unit-integration, e2e]
    if: always()
    steps:
      - name: Verify upstream jobs succeeded
        run: |
          echo "unit-integration: ${{ needs.unit-integration.result }}"
          echo "e2e:              ${{ needs.e2e.result }}"
          test "${{ needs.unit-integration.result }}" = "success" \
            && test "${{ needs.e2e.result }}" = "success" \
            && echo "RELEASE GATE: CLEARED" \
            || { echo "RELEASE GATE: BLOCKED"; exit 1; }
